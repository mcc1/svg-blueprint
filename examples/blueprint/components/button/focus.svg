  <style>.fill-surface{fill:#ffffff}.fill-accent{fill:#2f6fde}.fill-accent-hover{fill:#2459b8}.fill-accent-pressed{fill:#1b468f}.fill-muted{fill:#c9c9c4}.text-on-accent{fill:#ffffff}.text-muted{fill:#77776f}.stroke-line{stroke:#deded9}.stroke-focus{stroke:#f2a900}</style>
  <g id="body"><rect x="0.5" y="0.5" width="119" height="35" rx="6" class="fill-accent"/></g>
